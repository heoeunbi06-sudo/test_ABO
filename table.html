<!doctype html>
<html lang="en">
  <head>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
      }
      table#t01 {
        border-collapse: collapse;
        width: 80%;
      }
      table#t01 th {
        background-color: darkgrey;
        border: 1px solid black;
        text-align: center;
        padding: 20px;
      }
      table#t01 td {
        border: 1px solid black;
        text-align: center;
        padding: 15px;
      }

      table#t02 {
        width: 80%;
      }
      table#t02 td{padding: 15px;}
      colgroup col:first {
        background: #e8e8e8;
      }
      colgroup col {
        background: #e3f8e9;
      }
      thead,tfoot{
        background-color: #d6eaf8;
      }
    </style>
  </head>
  <body>
    <table id="t01">
      <tr>
        <th>도시</th>
        <th>일자</th>
        <th>기온</th>
        <th>고도</th>
        <th>인구</th>
        <th>식당등급</th>
      </tr>
      <tr>
        <td>왈라왈라, 워싱턴주</td>
        <td>6월 15일</td>
        <td>75</td>
        <td>1,204ft</td>
        <td>29,686</td>
        <td>4/5</td>
      </tr>
      <tr>
        <td>매직 시티, 아이다호주</td>
        <td>6월 25일</td>
        <td>75</td>
        <td>5,312ft</td>
        <td>50</td>
        <td>3/5</td>
      </tr>
      <tr>
        <td>진실 혹은 결과, 뉴멕시코주</td>
        <td>8월 9일</td>
        <td>93</td>
        <td rowspan="2">4,242ft</td>
        <td rowspan="2">7,289</td>
        <td>5/5</td>
      </tr>
      <tr>
        <td>진실 혹은 결과, 뉴멕시코주</td>
        <td>8월 9일</td>
        <td>98</td>
        <td>4/5</td>
      </tr>
    </table>

    <table id="t02">
      <caption>
        가계부
      </caption>

      <colgroup>
        <col span="2" style="background-color: #e8e8e8;" />
        <col />
      </colgroup>

      <thead>
        <tr>
          <th>날짜</th>
          <th>항목</th>
          <th>금액</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>2026-01-01</td>
          <td>식료품</td>
          <td>50,000원</td>
        </tr>
        <tr>
          <td>2026-01-01</td>
          <td>교통비</td>
          <td>20,000원</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="2">총계</td>
          <td>70,000원</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
